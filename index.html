<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Sakeenah — offline Quran, prayer times, adhan, adhkar and free audio."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("sakeenah.theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" ? "dark" : "light";
        if (localStorage.getItem("sakeenah.locale") === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        }
      } catch {}
    </script>
    <title>سَكينة · Sakeenah</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
